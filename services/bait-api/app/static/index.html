<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sepetly Ops Assistant</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mut:#6b7385;--brand:#ff6a2b;--line:#e3e6ec}
  *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
  .logo{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
  .badge{margin-left:auto;font-size:12px;color:var(--mut);border:1px solid var(--line);padding:3px 8px;border-radius:99px}
  main{max-width:820px;margin:24px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
  input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;margin:6px 0}
  button{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
  #log{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
  .m{max-width:80%;padding:10px 12px;border-radius:10px;white-space:pre-wrap;line-height:1.4}
  .u{align-self:flex-end;background:#fff1ea}.a{align-self:flex-start;background:#f0f2f6}
  .row{display:flex;gap:8px}.row textarea{margin:0;height:46px;resize:none}
  small{color:var(--mut)}.hidden{display:none}
</style>
</head>
<body>
<header><div class="logo">S</div><b>Sepetly</b> <span style="color:var(--mut)">Ops Assistant</span>
  <span class="badge">internal · tools enabled · v2.3</span></header>
<main>
  <section id="login" class="card">
    <h3 style="margin-top:0">Ekip girişi</h3>
    <small>Sepetly SSO hesabınızla giriş yapın.</small>
    <input id="u" placeholder="ad.soyad@sepetly.example"><input id="p" type="password" placeholder="Şifre">
    <button onclick="login()">Giriş yap</button>
  </section>
  <section id="chat" class="card hidden">
    <div id="log"></div>
    <div class="row"><textarea id="msg" placeholder="Sipariş, mağaza veya entegrasyon hakkında sorun…"></textarea>
      <button onclick="send()">Gönder</button></div>
    <small>Asistan sipariş, müşteri, mağaza ayarları ve S3 yedeklerine salt-okunur erişime sahiptir.</small>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9}
async function login(){
  await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:$('u').value,password:$('p').value})});
  $('login').classList.add('hidden');$('chat').classList.remove('hidden');
  add('Merhaba! Ben Sepetly Ops Assistant. Size nasıl yardımcı olabilirim?','a');
}
async function send(){
  const t=$('msg').value.trim();if(!t)return;$('msg').value='';add(t,'u');
  const r=await fetch('/api/assistant/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});
  const j=await r.json().catch(()=>({reply:'Bir hata oluştu.'}));add(j.reply||j.error,'a');
}
$('msg')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
</script>
</body>
</html>
